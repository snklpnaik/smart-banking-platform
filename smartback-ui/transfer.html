<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transfer Money | Smart Bank</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body onload="loadTransferPage()">

<div class="navbar">

    <h2>🏦 Smart Bank</h2>

    <button onclick="location.href='dashboard.html'">
        Dashboard
    </button>

</div>

<div class="container">

    <div class="card">

        <h2>Transfer Money</h2>

        <table>

            <tr>
                <th>From Account</th>
                <td id="fromAccount">-</td>
            </tr>

            <tr>
                <th>Account Type</th>
                <td id="accountType">-</td>
            </tr>

            <tr>
                <th>Available Balance</th>
                <td id="balance">₹0.00</td>
            </tr>

        </table>

    </div>

    <div class="card">

        <label>To Account Number</label>

        <input
                type="text"
                id="toAccount"
                placeholder="Enter Receiver Account Number">

        <label>Amount</label>

        <input
                type="number"
                id="amount"
                placeholder="Enter Transfer Amount">

        <button onclick="transferMoney()">
            Transfer
        </button>

        <button
                class="back-btn"
                onclick="location.href='dashboard.html'">

            Back

        </button>

        <p class="success" id="success"></p>

        <p class="error" id="error"></p>

    </div>

</div>

<div class="footer">

    © 2026 Smart Bank

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/transfer.js"></script>

</body>

</html>
