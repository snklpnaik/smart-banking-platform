<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body onload="loadProfile()">

<div class="navbar">

    <h2>🏦 Smart Bank</h2>

    <button onclick="location.href='dashboard.html'">
        Dashboard
    </button>

</div>

<div class="container">

    <div class="card">

        <h2>My Profile</h2>

        <table>

            <tr>
                <th>Customer ID</th>
                <td id="customerId"></td>
            </tr>

            <tr>
                <th>Name</th>
                <td id="name"></td>
            </tr>

            <tr>
                <th>Username</th>
                <td id="username"></td>
            </tr>

            <tr>
                <th>Email</th>
                <td id="email"></td>
            </tr>

            <tr>
                <th>Phone</th>
                <td id="phone"></td>
            </tr>

            <tr>
                <th>Account Number</th>
                <td id="accountNumber"></td>
            </tr>

            <tr>
                <th>Account Type</th>
                <td id="accountType"></td>
            </tr>

            <tr>
                <th>Balance</th>
                <td id="balance"></td>
            </tr>

            <tr>
                <th>Status</th>
                <td id="status"></td>
            </tr>

        </table>

        <button
            class="back-btn"
            onclick="location.href='dashboard.html'">
            Back
        </button>

    </div>

</div>

<div class="footer">
    © 2026 Smart Bank
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>

</body>

</html>
