<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body onload="loadAdminDashboard()">

<div class="navbar">

    <h2>🏦 Smart Bank - Admin</h2>

    <button onclick="logout()">
        Logout
    </button>

</div>

<div class="container">

    <div class="card">

        <h2>Admin Dashboard</h2>

        <div class="menu">

            <button onclick="createAccount()">
                Create Account
            </button>

            <button onclick="searchAccount()">
                Search Account
            </button>

            <button onclick="updateAccount()">
                Update Account
            </button>

            <button onclick="deleteAccount()">
                Delete Account
            </button>

            <button onclick="viewAllAccounts()">
                View All Accounts
            </button>

            <button
                class="back-btn"
                onclick="location.href='dashboard.html'">
                Back
            </button>

        </div>

    </div>

    <div class="card">

        <h3>Account Details</h3>

        <input
            type="text"
            id="accountNumber"
            placeholder="Enter Account Number"
        >

        <button onclick="searchAccount()">
            Search
        </button>

        <table>

            <tr>
                <th>Account Number</th>
                <td id="accNumber">-</td>
            </tr>

            <tr>
                <th>Name</th>
                <td id="customerName">-</td>
            </tr>

            <tr>
                <th>Email</th>
                <td id="email">-</td>
            </tr>

            <tr>
                <th>Phone</th>
                <td id="phone">-</td>
            </tr>

            <tr>
                <th>Account Type</th>
                <td id="accountType">-</td>
            </tr>

            <tr>
                <th>Balance</th>
                <td id="balance">-</td>
            </tr>

            <tr>
                <th>Status</th>
                <td id="status">-</td>
            </tr>

        </table>

    </div>

    <div class="card">

        <h3>All Accounts</h3>

        <table>

            <thead>

            <tr>
                <th>Account No</th>
                <th>Name</th>
                <th>Type</th>
                <th>Balance</th>
                <th>Status</th>
            </tr>

            </thead>

            <tbody id="accountTable">

            </tbody>

        </table>

    </div>

</div>

<div class="footer">
    © 2026 Smart Bank
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>

</body>

</html>
