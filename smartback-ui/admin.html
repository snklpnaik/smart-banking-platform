<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Smart Bank</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body onload="loadAdminDashboard()">

<div class="navbar">

    <h2>🏦 Smart Bank - Admin</h2>

    <button onclick="logout()">
        Logout
    </button>

</div>

<div class="container">

    <!-- Search Account -->

    <div class="card">

        <h2>Search Account</h2>

        <input
                type="text"
                id="accountNumber"
                placeholder="Enter Account Number">

        <button onclick="searchAccount()">
            Search
        </button>

    </div>

    <!-- Account Details -->

    <div class="card">

        <h2>Account Details</h2>

        <table>

            <tr>
                <th>Account Number</th>
                <td id="accNumber">-</td>
            </tr>

            <tr>
                <th>User ID</th>
                <td id="userId">-</td>
            </tr>

            <tr>
                <th>Account Type</th>
                <td id="accountType">-</td>
            </tr>

            <tr>
                <th>Balance</th>
                <td id="balance">₹0.00</td>
            </tr>

            <tr>
                <th>Status</th>
                <td id="status">-</td>
            </tr>

            <tr>
                <th>Created At</th>
                <td id="createdAt">-</td>
            </tr>

        </table>

    </div>

    <!-- Actions -->

    <div class="menu">

        <button onclick="createAccount()">
            Create Account
        </button>

        <button onclick="updateBalance()">
            Update Balance
        </button>

        <button onclick="creditAccount()">
            Credit
        </button>

        <button onclick="debitAccount()">
            Debit
        </button>

        <button onclick="viewAllAccounts()">
            Refresh
        </button>

        <button
                class="back-btn"
                onclick="location.href='dashboard.html'">

            Dashboard

        </button>

    </div>

    <!-- All Accounts -->

    <div class="card">

        <h2>Accounts</h2>

        <table>

            <thead>

            <tr>

                <th>Account Number</th>

                <th>User ID</th>

                <th>Type</th>

                <th>Balance</th>

                <th>Status</th>

            </tr>

            </thead>

            <tbody id="accountTable">

            </tbody>

        </table>

    </div>

</div>

<div class="footer">

    © 2026 Smart Bank

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>

</body>

</html>
