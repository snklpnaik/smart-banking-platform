<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bank - Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body onload="loadDashboard()">

<div class="navbar">
    <h2>🏦 Smart Bank</h2>

    <button onclick="logout()">Logout</button>
</div>

<div class="container">

    <div class="balance-card">
        <h2>Welcome, <span id="username">User</span></h2>

        <p>Available Balance</p>

        <div class="balance">
            ₹ <span id="balance">0.00</span>
        </div>
    </div>

    <div class="menu">

        <button onclick="location.href='deposit.html'">
            Deposit
        </button>

        <button onclick="location.href='withdraw.html'">
            Withdraw
        </button>

        <button onclick="location.href='transfer.html'">
            Transfer
        </button>

        <button onclick="location.href='history.html'">
            Transactions
        </button>

        <button onclick="location.href='profile.html'">
            Profile
        </button>

        <button
            id="adminBtn"
            style="display:none"
            onclick="location.href='admin.html'">
            Admin
        </button>

    </div>

    <div class="card">

        <h3>Quick Account Summary</h3>

        <table>

            <tr>
                <th>Account Number</th>
                <td id="accountNumber">-</td>
            </tr>

            <tr>
                <th>Account Type</th>
                <td id="accountType">-</td>
            </tr>

            <tr>
                <th>Status</th>
                <td id="accountStatus">ACTIVE</td>
            </tr>

        </table>

    </div>

</div>

<div class="footer">
    © 2026 Smart Bank
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>

</body>

</html>
