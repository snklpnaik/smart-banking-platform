<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Smart Bank</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body onload="loadDashboard()">

<div class="navbar">

    <h2>🏦 Smart Bank</h2>

    <button onclick="logout()">Logout</button>

</div>

<div class="container">

    <!-- Account Summary -->

    <div class="balance-card">

        <h2 id="welcomeText">
            Welcome
        </h2>

        <p id="email">
            -
        </p>

        <br>

        <h3>Available Balance</h3>

        <div class="balance" id="balance">
            ₹0.00
        </div>

    </div>

    <!-- Account Details -->

    <div class="card">

        <h2>Account Details</h2>

        <table>

            <tr>
                <th>Account Number</th>
                <td id="accountNumber">-</td>
            </tr>

            <tr>
                <th>Account Type</th>
                <td id="accountType">-</td>
            </tr>

            <tr>
                <th>Status</th>
                <td id="status">-</td>
            </tr>

        </table>

    </div>

    <!-- Actions -->

    <div class="menu">

        <button onclick="location.href='deposit.html'">
            Deposit
        </button>

        <button onclick="location.href='withdraw.html'">
            Withdraw
        </button>

        <button onclick="location.href='transfer.html'">
            Transfer
        </button>

        <button onclick="location.href='history.html'">
            Transactions
        </button>

        <button onclick="location.href='profile.html'">
            Profile
        </button>

        <button
                id="adminButton"
                style="display:none"
                onclick="location.href='admin.html'">

            Admin

        </button>

    </div>

</div>

<div class="footer">

    © 2026 Smart Bank

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>

</body>

</html>
